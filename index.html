<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RDR2 Map - Tropys</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #1a1a1a;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Configuración del mapa usando coordenadas CRS.Simple ideales para mapas de videojuegos
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 2,
            maxZoom: 6,
            zoomControl: false // Quitamos los controles por defecto para hacerlo más limpio en móvil
        });

        // Agregamos controles de zoom personalizados en una esquina cómoda
        L.control.zoom({ position: 'bottomright' }).addT(map);

        // Límites del mapa de RDR2 en coordenadas personalizadas
        var bounds = [[0, 0], [8500, 10000]];
        map.setMaxBounds(bounds);

        // Usamos una capa base provisional optimizada para mapas de juegos (o tiles base estándar oscuros)
        // Nota: Aquí puedes apuntar a los tiles del mapa oficial de RDR2 o una capa base limpia
        var mapLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 6,
            minZoom: 2,
            noWrap: true,
            bounds: bounds,
            attribution: '&copy; RDR2 Tropys Map'
        }).addTo(map);

        // Centramos la vista inicial en el corazón de Valentine / Lemoyne
        map.setView([4000, 5000], 3);

        // Ejemplo de marcador de prueba en el mapa real
        var marker = L.marker([4000, 5000]).addTo(map)
            .bindPopup('<b>¡Aquí estamos!</b><br>Valentine, Heartlands.');

    </script>
</body>
</html>
