<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RDR2 Map - Tropys</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #1a1412; /* Color de fondo acorde al estilo del juego */
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Configuración de coordenadas planas para el mapa de RDR2
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 2,
            maxZoom: 6,
            zoomControl: false
        });

        // Controles de zoom abajo a la derecha
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Límites del mapa del mundo de RDR2
        var bounds = [[0, 0], [6144, 8192]];
        map.setMaxBounds(bounds);

        // Capa de tiles clásica del mapa de RDR2
        L.tileLayer('https://raw.githubusercontent.com/adamui/rdr2-map-tiles/master/tiles/{z}/{x}/{y}.jpg', {
            minZoom: 2,
            maxZoom: 5,
            noWrap: true,
            bounds: bounds,
            attribution: 'RDR2 Interactive Map'
        }).addTo(map);

        // Centrar en una zona principal (ej. Heartlands / Valentine)
        map.setView([3000, 4000], 3);

        // Marcador de prueba inicial
        L.marker([3000, 4000]).addTo(map)
            .bindPopup('<b>¡Tropys RDR2!</b><br>Mapa interactivo activo.');
    </script>
</body>
</html>
