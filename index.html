<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RDR2 Map - Tropys</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #1a1a1a;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Sistema de coordenadas planas para mapas de videojuegos
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 5,
            zoomControl: false
        });

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Dimensiones del mapa de RDR2 adaptadas para tiles estándar
        var bounds = [[0, 0], [8192, 8192]];
        map.setMaxBounds(bounds);

        // Cargamos los tiles oficiales del mapa de RDR2 adaptados para Leaflet
        L.tileLayer('https://s.rsg.sc/sc/images/games/RDR2/map/game/{z}/{x}/{y}.jpg', {
            minZoom: 0,
            maxZoom: 5,
            noWrap: true,
            bounds: bounds,
            attribution: 'Rockstar Games'
        }).addTo(map);

        // Vista inicial centrada
        map.setView([4096, 4096], 2);

        // Marcador de prueba
        L.marker([4096, 4096]).addTo(map)
            .bindPopup('<b>¡Mapa de RDR2 activo!</b>');
    </script>
</body>
</html>
